<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Print Factory Tycoon — Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>3D Print Factory Tycoon — Prototype</h1>
    <div class="hud">
      <span id="money">$0</span>
      <button id="btn-speed">Speed x1</button>
      <button id="btn-reset">Reset</button>
    </div>
  </header>
  <main>
    <canvas id="gameCanvas" width="960" height="640"></canvas>
    <aside class="panel">
      <h2>Starting Factory</h2>
      <p>Use this prototype to watch a small automated factory. It includes:</p>
      <ul>
        <li>A single printer that spawns products</li>
        <li>Conveyor belts that carry products</li>
        <li>A selling station that auto-sells products</li>
      </ul>
      <p>Open developer console to see logs.</p>
    </aside>
  </main>
  <script src="src/main.js"></script>
</body>
</html>
